# netwatch configuration.
#
# Every key below is optional and shown with its default. Delete anything you
# do not want to change. Install to /etc/netwatch/config.toml.

[dns]
# Serve DNS on all interfaces so LAN clients can reach it. Port 53 needs either
# root or CAP_NET_BIND_SERVICE (the systemd unit grants the capability).
listen = "0.0.0.0:53"

# Optional second listener for IPv6 clients. Off by default; most home routers
# hand out an IPv4 DNS server only. This is an *additional* socket, not a
# replacement — netwatch forces IPV6_V6ONLY on it so it cannot also claim the
# IPv4 port and collide with `listen` above.
#
# IPv6 clients are answered and logged normally, but appear by address rather
# than by device name (see "IPv6 clients are logged but not named" in the
# README).
# listen_v6 = "[::]:53"

# Answer over TCP as well. Required by spec: responses too big for UDP are
# returned truncated, and the client then retries over TCP.
enable_tcp = true

# Which clients may query us. Keywords "loopback", "private", "any", or CIDRs.
# The subnet netwatch detects on its own interface is trusted automatically
# under the "private" stance, so an ISP that hands out public addresses to LAN
# devices still works.
#
# Do NOT use "any" unless port 53 is genuinely unreachable from the internet:
# an open resolver gets abused for DNS amplification attacks. Add specific
# ranges instead, e.g. a guest VLAN or a VPN subnet:
#   allow_from = ["loopback", "private", "10.8.0.0/24"]
allow_from = ["loopback", "private"]

# Upstream resolvers, tried in order. Some alternatives:
#   Cloudflare  1.1.1.1        Quad9 (filters malware)  9.9.9.9
#   Google      8.8.8.8        Your router (uses ISP DNS) 192.168.1.1
upstreams = ["1.1.1.1:53", "9.9.9.9:53"]
upstream_timeout_ms = 2500

# Largest UDP answer we ask an upstream for. 1232 is the DNS Flag Day 2020
# value: big enough for nearly every answer, small enough to avoid IP
# fragmentation on a 1500-byte-MTU link. Bigger answers arrive over TCP.
upstream_udp_payload = 1232

# Overload limits. Past these, netwatch sheds work rather than queueing it:
# a dropped query is retried by the client, whereas an unbounded backlog
# would exhaust memory and then answer questions nobody is waiting for.
max_udp_in_flight = 128
max_tcp_connections = 64

# Ceiling on one request end to end, across every upstream attempt. Must be
# comfortably above upstream_timeout_ms x number of upstreams.
request_timeout_ms = 10000

# Local answer cache. This is where most of the perceived speed-up comes from.
cache = true
cache_max_entries = 20000
# Answers with a TTL shorter than this are simply not cached. This is a
# threshold, NOT a floor to round up to: a cache must never serve a longer TTL
# than the authority granted, because short TTLs are usually deliberate
# (failover, dynamic DNS). Set to 0 to cache everything.
cache_min_ttl = 30

# Upper bound on how long an entry is retained. Records still report their own
# TTL to clients; this only makes us re-check sooner.
cache_max_ttl = 86400

[web]
# Dashboard address. Loopback only by default: the dashboard can add block
# rules and flush the DNS cache, so reaching it from elsewhere should be a
# deliberate decision. The zero-configuration way in is an SSH tunnel:
#   ssh -L 8080:localhost:8080 pi@<pi-ip>
listen = "127.0.0.1:8080"

# Shared secret for the state-changing endpoints, sent as
#   Authorization: Bearer <token>
# The dashboard prompts for it once and keeps it for the browser session.
# Required whenever `listen` above is not loopback — netwatch refuses to start
# otherwise. Generate one with: openssl rand -hex 32
# admin_token = ""

[storage]
database = "/var/lib/netwatch/netwatch.db"

# Query log rows older than this are deleted hourly. A normal household is
# roughly 50-150 MB per 14 days.
#
# The default is sized for an SD card. On an SSD there is no reason to be shy:
# 90 days costs a few hundred MB and is what makes "is this device behaving
# differently than last month" answerable at all.
retention_days = 14

# Writes are batched for this long before committing. On an SD card this is
# about lifespan — batching is the difference between a card that lasts and one
# that does not. On an SSD it is only about latency, so 250 is comfortable and
# gives a fresher log; the batching still helps by turning many small commits
# into fewer larger ones.
flush_interval_ms = 750

[discovery]
# Read the kernel ARP table for IP <-> MAC pairs.
arp = true
arp_interval_secs = 15

# Listen for mDNS/Bonjour announcements to learn device names. Skipped
# automatically if Avahi already holds port 5353.
mdns = true

# Listen for DHCP requests, which carry both the MAC and the hostname the
# device asks for. netwatch only listens and never answers.
#
# OFF by default. A UDP/67 socket joins a SO_REUSEPORT group with any other
# socket on this host bound to the same port by the same user, and a reuseport
# group *shares* incoming datagrams rather than each member getting a copy.
# The dedicated service user makes that unlikely (a differently-owned DHCP
# server just makes our bind fail cleanly), but losing household DHCP is far
# worse than losing hostname enrichment, so this is opt-in.
#
# Safe to enable when nothing else on this Pi serves DHCP. Check with:
#   sudo ss -ulnp | grep :67
dhcp = false

# Send one harmless UDP probe to each address in the LAN so the kernel resolves
# its MAC. Without this, devices that are idle never appear at all.
sweep = true
sweep_interval_secs = 120

# Ask the router for PTR records of clients we cannot otherwise name.
reverse_dns = true

# Override the auto-detected LAN range. Normally unnecessary — netwatch reads it
# from the routing table.
# subnet = "192.168.1.0/24"

# Optional full IEEE OUI database for exhaustive vendor coverage. ~140 common
# consumer prefixes are built in, so this is a nice-to-have:
#   curl -o /var/lib/netwatch/oui.csv https://standards-oui.ieee.org/oui/oui.csv
# oui_file = "/var/lib/netwatch/oui.csv"

[blocking]
enabled = true

# How a blocked name is answered:
#   "zero_ip"  -> 0.0.0.0 / :: (clients fail fast; what Pi-hole does by default)
#   "nxdomain" -> NXDOMAIN (tidier, but some apps retry harder)
mode = "zero_ip"

# Blocklists to download. Four formats are understood: hosts files, one
# domain per line, wildcard lists (*.example.com), and the domain-anchored
# subset of Adblock Plus syntax (||example.com^, @@||example.com^).
#
# Overlap between lists is large, so the total is far below the sum. The
# dashboard shows how many domains each source contributed *that no earlier
# source already had* — a source showing 0 is either fully redundant or in a
# format netwatch cannot read, and the log says which.
#
# Order matters only for attribution: the first list to claim a domain is the
# one the query log names.
sources = [
  # ~135k. Ads plus malware; the usual starting point.
  "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts",

  # Hagezi. Pick ONE tier — they are cumulative, not additive:
  #   multi.txt      light, low breakage
  #   pro.txt        the recommended balance
  #   pro.plus.txt   more aggressive
  #   ultimate.txt   maximal, expect to allowlist things
  # "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.txt",

  # Hagezi Threat Intelligence Feed — malware, phishing, C2. Complements any
  # of the above rather than overlapping much.
  # "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif.txt",

  # OISD. Also pick one tier. Serves several formats; the hosts and abp ones
  # both parse here.
  # "https://big.oisd.nl/hosts",

  # Known DNS-over-HTTPS endpoints. Blocking these pushes devices that would
  # otherwise resolve past you back onto system DNS. Not airtight — a client
  # with a hardcoded IP still gets through — but it closes the easy cases.
  # "https://raw.githubusercontent.com/dibdot/DoH-IP-blocklists/master/doh-domains.txt",
]

# Extra lists you keep on disk. Hosts format or one domain per line; a leading
# "*." makes it a wildcard covering subdomains.
files = []

refresh_hours = 24

# Answer NXDOMAIN for use-application-dns.net, Mozilla's canary domain.
# Firefox checks that name on every network it joins and switches its own
# DNS-over-HTTPS off when the answer is NXDOMAIN, so its queries come back
# through netwatch where you can see them. Without it Firefox resolves via
# Cloudflare directly and the dashboard silently under-reports.
# Set false if you would rather Firefox keep using DoH.
disable_firefox_doh = true

# Downloaded lists plus the dashboard-managed allow.list and deny.list.
state_dir = "/var/lib/netwatch"

[alerts]
# The handful of events worth interrupting someone for. Deliberately narrow: a
# monitor that alerts on everything teaches you to ignore it.
enabled = true

# ntfy topic URL. Leave empty to record alerts in the dashboard without
# pushing them anywhere. Install the ntfy app, pick an unguessable topic name,
# and use it here:
#   ntfy_url = "https://ntfy.sh/netwatch-4f9c2a71b3"
#
# Anyone who knows this URL can both read your alerts and publish to the topic,
# so treat it as a secret — which is also why netwatch never logs it or returns
# it from the API. config.toml is installed root:netwatch 0640 for this reason.
ntfy_url = ""

# A MAC appearing on the network for the first time. This is the
# security-relevant event on a home LAN. Devices already in the database are
# not "new", so a restart does not re-announce your whole household.
new_device = true

# One client racking up NXDOMAIN answers fast — the usual shape of malware
# walking a generated domain list looking for its command-and-control host.
# A broken app can do it too, so it is a warning rather than a verdict.
nxdomain_storm = true
nxdomain_threshold = 50
nxdomain_window_mins = 10

# How often the threshold conditions are evaluated.
scan_interval_secs = 300

# Minimum gap between two alerts about the same subject and kind, so an
# ongoing condition reports once instead of once per scan.
cooldown_mins = 60
